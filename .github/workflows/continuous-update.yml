name: Katu component packages
on:
  push:
    paths:
      - 'packages/**'
      - 'scripts/release/**'
      - 'scripts/tests/**'
      - '.github/workflows/continuous-update.yml'
  workflow_dispatch:
    inputs:
      package:
        description: Component package to build in a manual run
        type: choice
        options:
          - katu-ai
          - katu-backup
          - katu-branding
          - katu-central
          - katu-connect
          - katu-core
          - katu-default-settings
          - katu-desktop
          - katu-desktop-defaults
          - katu-diagnostic
          - katu-drivers
          - katu-feedback
          - katu-help
          - katu-ia
          - katu-icons
          - katu-installer
          - katu-release
          - katu-repo-config
          - katu-store
          - katu-theme
          - katu-update
          - katu-wallpapers
          - katu-webapps
          - katu-welcome
          - katu-xampp
        default: katu-update
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install test and packaging tools
        run: |
          apt-get update
          apt-get install -y python3 python3-apt python3-pyqt5 python3-requests pkexec systemd libnotify-bin lsb-release dpkg-dev apt-utils gnupg lintian git
      - name: Unit tests
        run: python3 -m unittest discover -s scripts/tests -p test_continuous_update.py -v
      - name: Select changed packages
        id: changed
        env:
          PACKAGE_INPUT: ${{ inputs.package }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            packages="$PACKAGE_INPUT"
          else
            packages=$(python3 scripts/release/changed-packages.py --event "$GITHUB_EVENT_PATH")
          fi
          printf '%s\n' "$packages" > "$RUNNER_TEMP/katu-packages"
          cat "$RUNNER_TEMP/katu-packages"
      - name: Build changed components independently
        run: |
          while IFS= read -r package; do
            [ -z "$package" ] || bash scripts/release/build-package.sh "$package"
          done < "$RUNNER_TEMP/katu-packages"
      - name: Lint changed packages
        run: |
          while IFS= read -r package; do
            [ -z "$package" ] || bash scripts/release/test-package.sh "output/packages/${package}_"*.deb
          done < "$RUNNER_TEMP/katu-packages"
      - name: Real authenticated APT integration tests
        env:
          KATU_DISPOSABLE_TEST: '1'
        run: python3 scripts/tests/integration_updates.py
      - name: Existing Qt interface smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 scripts/tests/smoke_update_ui.py
      - name: Public beta repository APT smoke test
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/tests/smoke_public_repository.sh beta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: katu-component-candidates
          path: |
            output/packages/*.deb
            output/update-ui.png
      # Production signing is intentionally separate: no signing key in test jobs.
