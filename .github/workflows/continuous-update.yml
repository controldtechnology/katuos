name: Katu component packages
on:
  push:
    paths:
      - 'packages/**'
      - 'scripts/release/**'
      - 'scripts/tests/*update*'
      - '.github/workflows/continuous-update.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install test and packaging tools
        run: |
          apt-get update
          apt-get install -y python3 python3-apt python3-pyqt5 python3-requests pkexec systemd libnotify-bin lsb-release dpkg-dev apt-utils gnupg lintian git
      - name: Unit tests
        run: python3 -m unittest discover -s scripts/tests -p test_continuous_update.py -v
      - name: Select changed packages
        id: changed
        run: |
          base='${{ github.event.before }}'
          case "$base" in ''|000*) base='HEAD^' ;; esac
          packages=$(python3 scripts/release/changed-packages.py --base "$base")
          printf '%s\n' "$packages" > "$RUNNER_TEMP/katu-packages"
          cat "$RUNNER_TEMP/katu-packages"
      - name: Build changed components independently
        run: |
          while IFS= read -r package; do
            [ -z "$package" ] || bash scripts/release/build-package.sh "$package"
          done < "$RUNNER_TEMP/katu-packages"
      - name: Lint changed packages
        run: |
          while IFS= read -r package; do
            [ -z "$package" ] || bash scripts/release/test-package.sh "output/packages/${package}_"*.deb
          done < "$RUNNER_TEMP/katu-packages"
      - name: Real authenticated APT integration tests
        env:
          KATU_DISPOSABLE_TEST: '1'
        run: python3 scripts/tests/integration_updates.py
      - name: Existing Qt interface smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 scripts/tests/smoke_update_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: katu-component-candidates
          path: |
            output/packages/*.deb
            output/update-ui.png
      # Production signing is intentionally separate: no signing key in test jobs.
