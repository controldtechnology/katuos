name: Build Katu OS ISO

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Criar release no GitHub com a ISO?'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-iso:
    name: Build Katu OS 1.0 (Debian Trixie + KDE)
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Liberar espaco em disco ────────────────────────────────────
      - name: Liberar espaco em disco
        run: |
          echo "=== Espaco antes ==="
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm /usr/share/swift /usr/local/julia*
          sudo apt-get remove -y \
            '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli \
            google-cloud-cli google-chrome-stable firefox \
            mono-devel libgl1-mesa-dri 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/cache/apt/archives/*
          echo "=== Espaco depois ==="
          df -h /

      # ── 3. Instalar live-build do Debian (nao Ubuntu) ─────────────────
      - name: Instalar live-build e ferramentas
        run: |
          # Dependencias base do Ubuntu
          sudo apt-get update -qq
          sudo apt-get install -y \
            debootstrap squashfs-tools xorriso isolinux \
            syslinux-common syslinux-efi dpkg-dev apt-utils rsync \
            gzip xz-utils wget curl ca-certificates gnupg dos2unix \
            python3-pyqt5 python3-pip

          # Instalar live-build do Debian Trixie (versao compativel com todas as opcoes)
          sudo tee /etc/apt/sources.list.d/debian-trixie-lb.list > /dev/null << 'EOF'
          deb [trusted=yes] http://deb.debian.org/debian trixie main
          EOF
          sudo tee /etc/apt/preferences.d/debian-trixie-lb > /dev/null << 'EOF'
          Package: *
          Pin: release n=trixie
          Pin-Priority: -10

          Package: live-build
          Pin: release n=trixie
          Pin-Priority: 900
          EOF
          sudo apt-get update -qq
          sudo apt-get install -y live-build
          sudo rm -f /etc/apt/sources.list.d/debian-trixie-lb.list \
                     /etc/apt/preferences.d/debian-trixie-lb
          sudo apt-get update -qq
          lb --version
          echo "live-build instalado do Debian Trixie"

      # ── 4. Corrigir line endings (BOM + CRLF -> LF) ──────────────────
      - name: Corrigir line endings Windows para Linux
        run: |
          find packages/ config/ installer/ scripts/ -type f \
            ! -name "*.png" ! -name "*.jpg" ! -name "*.ico" \
            ! -name "*.gif" ! -name "*.pdf" ! -name "*.deb" \
            -exec dos2unix -q {} \; 2>/dev/null || true
          find packages/ -name "postinst" -o -name "preinst" \
            -o -name "postrm" -o -name "prerm" | xargs -r chmod 755
          find config/hooks/ -name "*.chroot" | xargs -r chmod 755
          find scripts/ -name "*.sh" | xargs -r chmod 755
          echo "Line endings corrigidos"

      # ── 5. Construir pacotes .deb proprios do Katu ────────────────────
      - name: Construir pacotes Katu .deb
        run: |
          set -e
          mkdir -p build/packages output logs

          for pkg_dir in packages/*/; do
            pkg_name=$(basename "$pkg_dir")
            echo "=== Construindo: $pkg_name ==="
            find "${pkg_dir}/DEBIAN" -name "postinst" -o -name "preinst" \
              -o -name "postrm" -o -name "prerm" 2>/dev/null | xargs -r chmod 755
            if sudo dpkg-deb --build "$pkg_dir" "build/packages/${pkg_name}.deb"; then
              echo "OK: $pkg_name.deb"
            else
              echo "AVISO: falha ao construir $pkg_name — continuando"
            fi
          done

          if ls build/packages/*.deb 2>/dev/null; then
            cd build/packages
            sudo dpkg-scanpackages . /dev/null > Packages 2>/dev/null
            gzip -k Packages
            cd ../..
          fi
          ls -lh build/packages/*.deb 2>/dev/null || echo "(nenhum pacote gerado)"

      # ── 6. Preparar configuracao live-build ──────────────────────────
      - name: Preparar live-build config
        run: |
          set -e
          mkdir -p build

          rsync -a config/ build/config/

          if [ -d sddm ]; then
            mkdir -p build/config/includes.chroot/usr/share/sddm/themes
            rsync -a sddm/ build/config/includes.chroot/usr/share/sddm/themes/
          fi
          if [ -d plymouth ]; then
            mkdir -p build/config/includes.chroot/usr/share/plymouth/themes
            rsync -a plymouth/ build/config/includes.chroot/usr/share/plymouth/themes/
          fi
          if [ -d grub ]; then
            mkdir -p build/config/includes.binary/boot/grub/themes
            rsync -a grub/ build/config/includes.binary/boot/grub/themes/
          fi
          if [ -d plasma ]; then
            mkdir -p build/config/includes.chroot/usr/share/plasma
            rsync -a plasma/ build/config/includes.chroot/usr/share/plasma/
          fi
          if [ -d installer/calamares ]; then
            mkdir -p build/config/includes.chroot/etc/calamares
            rsync -a installer/calamares/ build/config/includes.chroot/etc/calamares/
          fi

          # Repositorio local dos pacotes Katu
          mkdir -p build/config/archives
          printf 'deb [trusted=yes] file://%s/build/packages ./\n' "$(pwd)" \
            > build/config/archives/katu-local.list.chroot

          echo "Config preparada:"
          ls build/config/

      # ── 7. lb config ─────────────────────────────────────────────────
      - name: lb config
        working-directory: build
        run: |
          sudo lb config \
            --distribution trixie \
            --architecture amd64 \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-chroot-security "http://security.debian.org/debian-security/" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --bootloaders grub-efi,grub-pc \
            --debian-installer none \
            --memtest none \
            --iso-application "Katu OS" \
            --iso-preparer "Katu OS Team" \
            --iso-publisher "katuos.com.br" \
            --iso-volume "KATU_OS_1.0" \
            --bootappend-live "boot=live components username=katu hostname=katu" \
            --compression xz \
            --verbose
          echo "lb config OK"

      # ── 8. lb build (45-90 minutos) ──────────────────────────────────
      - name: lb build
        working-directory: build
        run: |
          echo "=== Iniciando lb build: $(date) ==="
          sudo lb build 2>&1 | tee ../logs/build.log
          echo "=== Build concluido: $(date) ==="

      # ── 9. Localizar ISO gerada ───────────────────────────────────────
      - name: Localizar ISO gerada
        run: |
          ISO=$(find build/ -name "*.iso" | head -1)
          if [ -z "$ISO" ]; then
            echo "ERRO: ISO nao encontrada!"
            ls -la build/
            exit 1
          fi
          echo "ISO encontrada: $ISO"
          mkdir -p output
          cp "$ISO" output/katu-os-1.0-amd64.iso
          sha256sum output/katu-os-1.0-amd64.iso > output/katu-os-1.0-amd64.iso.sha256
          ls -lh output/
          echo "ISO_PATH=output/katu-os-1.0-amd64.iso" >> $GITHUB_ENV
          echo "ISO_SIZE=$(du -sh output/katu-os-1.0-amd64.iso | cut -f1)" >> $GITHUB_ENV

      # ── 10. Upload ISO como artefato ─────────────────────────────────
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: katu-os-1.0-amd64-iso
          path: |
            output/katu-os-1.0-amd64.iso
            output/katu-os-1.0-amd64.iso.sha256
          retention-days: 30
          compression-level: 0

      # ── 11. Upload log de build (sempre) ─────────────────────────────
      - name: Upload log de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: logs/build.log
          retention-days: 7

      # ── 12. Criar Release GitHub (opcional) ──────────────────────────
      - name: Criar Release GitHub
        if: github.event.inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Katu OS 1.0 - Amazonia Dark
          body: |
            ## Katu OS 1.0 - Lancamento Inicial

            Distribuicao Linux brasileira baseada em **Debian 13 Trixie + KDE Plasma**.

            ### O que esta incluido
            - Sistema base Debian 13 Trixie
            - KDE Plasma com tema Amazonia Dark
            - Firefox + Google Chrome
            - LibreOffice completo em PT-BR
            - Instalador visual estilo Windows 11
            - Hub de IA (Claude, GPT-4, Gemini, Ollama)
            - Painel LAMP / Katu XAMPP

            ### Como instalar
            1. Baixe o arquivo `.iso`
            2. Grave em pendrive com Balena Etcher (https://etcher.balena.io/)
            3. Reinicie o computador pelo pendrive
            4. Clique em "Instalar Katu OS"
          files: |
            output/katu-os-1.0-amd64.iso
            output/katu-os-1.0-amd64.iso.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 13. Resumo final ──────────────────────────────────────────────
      - name: Resumo do build
        if: always()
        run: |
          echo "## Resultado do Build" >> $GITHUB_STEP_SUMMARY
          if [ -f output/katu-os-1.0-amd64.iso ]; then
            echo "ISO gerada com sucesso!" >> $GITHUB_STEP_SUMMARY
            echo "- Arquivo: katu-os-1.0-amd64.iso" >> $GITHUB_STEP_SUMMARY
            echo "- Tamanho: ${{ env.ISO_SIZE }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "Build falhou. Verifique o log de build." >> $GITHUB_STEP_SUMMARY
          fi
