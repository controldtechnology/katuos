name: Build Katu OS ISO

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Katu OS 1.0 (Debian Trixie + KDE)
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Liberar espaco em disco ────────────────────────────────────
      - name: Liberar espaco em disco
        run: |
          echo "=== Espaco antes ==="
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm /usr/share/swift /usr/local/julia*
          sudo apt-get remove -y \
            '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli \
            google-cloud-cli google-chrome-stable firefox \
            mono-devel libgl1-mesa-dri 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/cache/apt/archives/*
          echo "=== Espaco depois ==="
          df -h /

      # ── 3. Instalar live-build do Debian (nao Ubuntu) ─────────────────
      - name: Instalar live-build e ferramentas
        run: |
          # Dependencias base do Ubuntu
          sudo apt-get update -qq
          sudo apt-get install -y \
            debootstrap squashfs-tools xorriso isolinux \
            syslinux-common syslinux-efi dpkg-dev apt-utils rsync \
            gzip xz-utils wget curl ca-certificates gnupg dos2unix \
            python3-pyqt5 python3-pip python3-yaml initramfs-tools-core zstd lz4 cpio mtools grub-common qemu-system-x86 qemu-kvm

          # Instalar live-build e debian-archive-keyring do Debian Trixie
          # (Ubuntu 2021 keyring nao tem a chave Trixie 762F67A0B2C39DE4)
          sudo tee /etc/apt/sources.list.d/debian-trixie-lb.list > /dev/null << 'EOF'
          deb [trusted=yes] http://deb.debian.org/debian trixie main
          EOF
          sudo tee /etc/apt/preferences.d/debian-trixie-lb > /dev/null << 'EOF'
          Package: *
          Pin: release n=trixie
          Pin-Priority: -10

          Package: live-build
          Pin: release n=trixie
          Pin-Priority: 900

          Package: debian-archive-keyring
          Pin: release n=trixie
          Pin-Priority: 900
          EOF
          sudo apt-get update -qq
          sudo apt-get install -y live-build debian-archive-keyring
          sudo rm -f /etc/apt/sources.list.d/debian-trixie-lb.list \
                     /etc/apt/preferences.d/debian-trixie-lb
          sudo apt-get update -qq
          lb --version
          echo "live-build instalado do Debian Trixie"

      # ── 4. Corrigir line endings (BOM + CRLF -> LF) ──────────────────
      - name: Corrigir line endings Windows para Linux
        run: |
          find packages/ config/ installer/ scripts/ -type f \
            ! -name "*.png" ! -name "*.jpg" ! -name "*.ico" \
            ! -name "*.gif" ! -name "*.pdf" ! -name "*.deb" \
            -exec dos2unix -q {} \; 2>/dev/null || true
          find packages/ -name "postinst" -o -name "preinst" \
            -o -name "postrm" -o -name "prerm" | xargs -r chmod 755
          find config/hooks/ -name "*.chroot" -o -name "*.binary" | xargs -r chmod 755
          find scripts/ -name "*.sh" | xargs -r chmod 755
          echo "Line endings corrigidos"

      # ── 5. Habilitar KVM para smoke test mais rapido ──────────────────
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm && echo "KVM disponivel" || echo "KVM indisponivel — TCG fallback"

      - name: Clean build, preflight, final ISO validation and QEMU smoke
        run: sudo bash scripts/build.sh

      - name: Upload ISO and test evidence for manual review
        if: always() && hashFiles('output/candidate-*/*.iso') != ''
        uses: actions/upload-artifact@v4
        with:
          name: katu-os-test-candidate-${{ github.run_id }}
          path: |
            output/candidate-*/*.iso
            output/candidate-*/SHA256SUMS
            output/candidate-*/manifest.json
            output/candidate-*/*.json
            output/candidate-*/*.log
          compression-level: 0
          retention-days: 30

      - name: Release policy
        if: always()
        run: |
          echo 'This workflow artifact is a test candidate, not a production release. A failed QEMU smoke check remains a failure. Production release requires scripts/release-gate.py and manual evidence for the exact SHA-256.' >> "$GITHUB_STEP_SUMMARY"
