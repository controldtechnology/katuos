# Katu OS — Calamares settings.conf

modules-search:
  - local

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - luksopenswaphookcfg
    - initcpiocfg
    - initcpio
    - networkcfg
    - hwclock
    - services-systemd
    - users
    - displaymanager
    - packages
    - grubcfg
    - bootloader
    - shellprocess
    - umount
  - show:
    - finished

branding: katu

# Mostrar etapas no topo
prompt-install: true

# Desfazer por padrão
dont-chroot: false

# Título da janela
windowTitle: "Instalador Katu OS"
