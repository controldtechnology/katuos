---
# Calamares packages module — remove pacotes live-only após instalação
# e instala pacotes adicionais se necessário

backend:  apt

update_db:      false
update_db_separately: false

# Operações executadas no sistema instalado
operations:
    # Remover infraestrutura live que não deve ir para o sistema instalado
    -   remove:
            - live-boot
            - live-boot-initramfs-tools
            - live-config
            - live-config-systemd
            - calamares
            - calamares-settings-debian
            - katu-installer
