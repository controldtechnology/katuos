---
# Calamares shellprocess module — comandos pós-instalação executados no chroot

# Executar dentro do chroot do sistema instalado
dontChroot:  false

timeout: 120

script:
    # Regenerar initramfs com o hardware real detectado
    -   "-/usr/sbin/update-initramfs -u -k all"

    # Atualizar cache de ícones
    -   "-/usr/bin/gtk-update-icon-cache -f /usr/share/icons/hicolor"

    # Regenerar cache de fontes
    -   "-/usr/bin/fc-cache -f"

    # Ativar NetworkManager como padrão (sem systemd-networkd conflito)
    -   "systemctl enable NetworkManager"
    -   "systemctl disable systemd-networkd || true"

    # Remover arquivo de configuração do live que força usuário 'katu'
    -   "rm -f /etc/live/config.conf || true"
    -   "rm -f /etc/live/config.conf.d/katu.conf || true"

    # Limpar ID de máquina — será regenerado no primeiro boot
    -   "truncate -s 0 /etc/machine-id"

    # Configurar timezone
    -   "ln -sf /usr/share/zoneinfo/America/Sao_Paulo /etc/localtime"
    -   "dpkg-reconfigure -f noninteractive tzdata || true"
