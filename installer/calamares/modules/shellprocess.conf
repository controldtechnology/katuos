---
# Calamares shellprocess module — comandos pós-instalação executados no chroot

# Executar dentro do chroot do sistema instalado
dontChroot:  false

timeout: 600

script:
    # Regenerar initramfs com o hardware real detectado
    -   "/usr/sbin/update-initramfs -u -k all"

    # Atualizar cache de ícones
    -   "-/usr/bin/gtk-update-icon-cache -f /usr/share/icons/hicolor"

    # Regenerar cache de fontes
    -   "-/usr/bin/fc-cache -f"

    # Ativar NetworkManager como padrão (sem systemd-networkd conflito)
    -   "systemctl enable NetworkManager"
    -   "systemctl disable systemd-networkd || true"

    # Remover arquivo de configuração do live que força usuário 'katu'
    -   "rm -f /etc/live/config.conf || true"
    -   "rm -f /etc/live/config.conf.d/katu.conf || true"

    # Não sobrescrever timezone e machine-id definidos pelos módulos anteriores.
    -   "rm -f /etc/polkit-1/rules.d/49-katu-calamares.rules /usr/share/applications/katu-install.desktop /usr/share/applications/katu-installer.desktop"
    # O atalho existe apenas no live; o /etc/skel é copiado para o usuário
    # criado pelo instalador, portanto também precisa ser limpo aqui.
    -   'find /home -type f \( -path "*/Área de Trabalho/katu-install.desktop" -o -path "*/Desktop/katu-install.desktop" \) -delete || true'
    -   "rm -f /etc/skel/Área de Trabalho/katu-install.desktop /etc/skel/Desktop/katu-install.desktop"
    -   "rm -f /etc/skel/.config/autostart/katu-live-start.desktop"
