---
# Calamares — módulo welcome
# Verificações e mensagens amigáveis em PT-BR

requirements:
    checker:
        - storage:
            required: true
            message: "Você precisa de pelo menos 20 GB de espaço livre no disco para instalar o Katu OS."
            minimumSize: 20
        - ram:
            required: false
            message: "O Katu OS funciona melhor com 4 GB de RAM. Com 2 GB funcionará, mas pode ser mais lento."
            minimumSize: 2
        - power:
            required: false
            message: "Conecte o carregador antes de instalar para evitar problemas durante a instalação."
        - internet:
            required: false
            message: "Sem internet no momento? Tudo bem — o Katu OS pode ser instalado sem conexão."
        - root:
            required: true

    tooltipOk:    "✓  Tudo certo!"
    tooltipFail:  "⚠  Verificar antes de continuar"

showSupportUrl:     true
showKnownIssuesUrl: false
showReleaseNotesUrl: false

geoip:
    style: "json"
    url: "https://geoip.kde.org/v1/calamares"
