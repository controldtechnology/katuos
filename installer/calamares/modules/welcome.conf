# Calamares — módulo welcome

# Verificações mínimas para instalação
requirements:
    - storage:
        minimum: 20   # GB mínimo
        recommended: 40
    - ram:
        minimum: 2    # GB mínimo
        recommended: 4
    - root:
        requiresRoot: true
    - internet:
        required: false   # Instalação offline suportada

# Checklist de boas-vindas
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: true
