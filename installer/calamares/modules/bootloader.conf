---
# Calamares bootloader module — instala e configura GRUB

efiBootLoader: "grub"
# Debian's EFI binaries use the debian directory internally.
efiBootloaderId: "debian"
installEFIFallback: true

kernel:       "/vmlinuz"
img:          "/initrd.img"
fallback:     "/initrd.img.bak"

grubInstall:  "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg:      "/boot/grub/grub.cfg"

# Tema GRUB
grubProbe:    "grub-probe"
efiBootMgr:   "efibootmgr"

# Parâmetros do kernel adicionados ao menu GRUB
# Kernel parameters are configured by the grubcfg module.
