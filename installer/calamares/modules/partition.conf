# Calamares — módulo partition

# Filesystem padrão
defaultFileSystemType: "ext4"

# Oferecer opções de criptografia
defaultEncryptionType: "luks2"

# EFI
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: "300M"

# Swap
userSwapChoices:
    - none
    - small
    - suspend
    - reuse
    - file

# Particionamento recomendado
# Automático vai usar todo o disco selecionado
# Avisar claramente antes de formatar

# Tamanhos mínimos
minimumSize: 20  # GB

# Btrfs experimental — desabilitar para 1.0 por estabilidade
# (manter ext4 como padrão seguro)
