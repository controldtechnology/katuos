---
# Calamares — módulo partition

defaultFileSystemType: "ext4"
defaultEncryptionType:  "luks2"

efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize: "512MiB"
efiSystemPartitionName: "EFI"

# Swap automático como arquivo (mais flexível que partição)
userSwapChoices:
    - file
    - none
    - small
    - suspend

# Opções de particionamento automático
# "erase" — usar todo o disco (recomendado para iniciantes)
# "alongside" — instalar ao lado de outro SO
# "replace" — substituir uma partição existente
# "manual" — particionamento manual avançado
initialPartitioningChoice: erase
initialSwapChoice: file

# Mostrar aviso de disco inteiro em PT-BR
eraseDiskWarning: true

minimumSize:     20   # GB
recommendedSize: 40   # GB

# Btrfs desabilitado para v1.0 (ext4 mais estável)
# Ativar em v2.0
