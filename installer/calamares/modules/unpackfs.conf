---
# Calamares unpackfs module — define o que copiar para o disco instalado
# O squashfs do live system é montado em /run/live/medium/live/filesystem.squashfs

unpack:
    -   source: "/run/live/medium/live/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""

# Excluir arquivos específicos do live que não devem ir para o sistema instalado
exclude:
    - "live"
    - "casper"
