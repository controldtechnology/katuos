# Katu OS — loopback.cfg para suporte a Ventoy e UEFI ISO loopback

set KATU_PARAMS="boot=live components quiet splash locale=pt_BR keyboard-layouts=br"

menuentry "Experimentar Katu OS" --class katu --class gnu-linux --class os {
    search --no-floppy --set=root --file /live/filesystem.squashfs
    linux  /live/vmlinuz ${KATU_PARAMS} noeject
    initrd /live/initrd.img
}

menuentry "Instalar Katu OS" --class katu --class installer {
    search --no-floppy --set=root --file /live/filesystem.squashfs
    linux  /live/vmlinuz ${KATU_PARAMS} noeject
    initrd /live/initrd.img
}
