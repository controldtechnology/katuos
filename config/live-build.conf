# Katu OS — live-build configuration
# This file is sourced by lb config and lb build

# === DISTRIBUIÇÃO ===
LB_DISTRIBUTION="trixie"
LB_PARENT_DISTRIBUTION="trixie"
LB_DISTRIBUTION_BINARY="trixie"
LB_DISTRIBUTION_CHROOT="trixie"

# === ARQUITETURA ===
LB_ARCHITECTURE="amd64"
LB_LINUX_PACKAGES="linux-image-amd64 linux-headers-amd64"

# === MIRROR ===
LB_MIRROR_BOOTSTRAP="https://deb.debian.org/debian"
LB_MIRROR_CHROOT="https://deb.debian.org/debian"
LB_MIRROR_CHROOT_SECURITY="https://deb.debian.org/debian-security"
LB_MIRROR_BINARY="https://deb.debian.org/debian"
LB_MIRROR_BINARY_SECURITY="https://deb.debian.org/debian-security"

# === REPOSITÓRIOS ===
LB_PARENT_MIRROR_BOOTSTRAP="https://deb.debian.org/debian"
LB_PARENT_MIRROR_CHROOT_SECURITY="https://deb.debian.org/debian-security"

# === COMPONENTES APT ===
LB_PARENT_DEBIAN_INSTALLER_DISTRIBUTION=""
LB_ARCHIVE_AREAS="main contrib non-free non-free-firmware"

# === BOOTLOADER ===
LB_BOOTLOADERS="grub-efi,grub-pc"
LB_GRUB_SPLASH=""

# === ISO ===
LB_ISO_APPLICATION="Katu OS"
LB_ISO_PREPARER="Katu OS Build System"
LB_ISO_PUBLISHER="Katu OS"
LB_ISO_VOLUME="KATU_OS_1.0"

# === LIVE ===
LB_DEBIAN_INSTALLER="none"
LB_MEMTEST="none"
LB_WIN32_LOADER="false"
LB_NET_COW_FILESYSTEM="overlay"

# === COMPRESSÃO ===
LB_COMPRESSION="xz"
LB_INITRAMFS="live-boot"

# === HOSTNAME ===
LB_HOSTNAME="katu"
LB_USERNAME="katu"

# === MODO ===
LB_SYSTEM="live"
LB_IMAGE_TYPE="iso-hybrid"
LB_BINARY_FILESYSTEM="fat32"

# === LOCALE ===
LB_LANGUAGE="pt_BR"
LB_KEYBOARD_LAYOUTS="br"
LB_KEYBOARD_MODEL="abnt2"
LB_TIMEZONE="America/Sao_Paulo"

# === VERBOSE ===
LB_VERBOSE="true"
