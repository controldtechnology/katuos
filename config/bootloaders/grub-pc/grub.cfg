# Katu OS — GRUB configuration (Live USB)

set default=1
set timeout=30
set timeout_style=menu

# Modulos necessarios
insmod regexp
insmod all_video
insmod gfxterm
insmod iso9660

# Carrega fonte para menu grafico
if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=1280x800,auto
    terminal_output gfxterm
fi

# Tema Katu
if [ -f /boot/grub/themes/katu/theme.txt ]; then
    set theme=/boot/grub/themes/katu/theme.txt
    export theme
fi

# Parametros de boot padrao Katu
set KATU_BOOT="quiet splash locale=pt_BR keyboard-layouts=br video=1280x800@60"

menuentry "Experimentar Katu OS" --class katu --class gnu-linux --class os {
    # Encontrar device com o squashfs e detectar kernel dentro do entry
    search --no-floppy --set=root --file /live/filesystem.squashfs
    set KATU_KERNEL=""
    set KATU_INITRD=""
    for k in /live/vmlinuz-*; do
        set KATU_KERNEL="$k"
    done
    for i in /live/initrd.img-*; do
        set KATU_INITRD="$i"
    done
    if [ -f /live/vmlinuz ]; then
        set KATU_KERNEL="/live/vmlinuz"
        set KATU_INITRD="/live/initrd.img"
    fi
    linux   ${KATU_KERNEL} boot=live components ${KATU_BOOT} noeject
    initrd  ${KATU_INITRD}
}

menuentry "Instalar Katu OS" --class katu --class installer {
    search --no-floppy --set=root --file /live/filesystem.squashfs
    set KATU_KERNEL=""
    set KATU_INITRD=""
    for k in /live/vmlinuz-*; do
        set KATU_KERNEL="$k"
    done
    for i in /live/initrd.img-*; do
        set KATU_INITRD="$i"
    done
    if [ -f /live/vmlinuz ]; then
        set KATU_KERNEL="/live/vmlinuz"
        set KATU_INITRD="/live/initrd.img"
    fi
    linux   ${KATU_KERNEL} boot=live components ${KATU_BOOT} noeject calamares
    initrd  ${KATU_INITRD}
}

