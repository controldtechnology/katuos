# Katu OS — GRUB configuration (Live USB)

set default=1
set timeout=30
set timeout_style=menu

# Encontrar dispositivo de boot pelo squashfs
search --no-floppy --set=root --file /live/filesystem.squashfs

# Detectar kernel e initrd (versionado ou nao)
set KATU_KERNEL=""
set KATU_INITRD=""
for k in /live/vmlinuz-*; do
    set KATU_KERNEL="$k"
done
for i in /live/initrd.img-*; do
    set KATU_INITRD="$i"
done
if [ -f /live/vmlinuz ]; then
    set KATU_KERNEL="/live/vmlinuz"
    set KATU_INITRD="/live/initrd.img"
fi

# Tema Katu
if [ -f /boot/grub/themes/katu/theme.txt ]; then
    set theme=/boot/grub/themes/katu/theme.txt
    export theme
fi

# Carrega fonte para menu grafico
if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
fi

# Parametros de boot padrao Katu
set KATU_BOOT="quiet splash locale=pt_BR keyboard-layouts=br video=1280x800@60"

# === Entradas do menu ===

menuentry "Experimentar Katu OS" --class katu --class gnu-linux --class os {
    linux   ${KATU_KERNEL} boot=live components ${KATU_BOOT} noeject
    initrd  ${KATU_INITRD}
}

menuentry "Instalar Katu OS" --class katu --class installer {
    linux   ${KATU_KERNEL} boot=live components ${KATU_BOOT} noeject calamares
    initrd  ${KATU_INITRD}
}

submenu "Opcoes avancadas" --class submenu {

    menuentry "Katu OS (modo de seguranca)" {
        linux   ${KATU_KERNEL} boot=live components nomodeset locale=pt_BR
        initrd  ${KATU_INITRD}
    }

    menuentry "Katu OS (verbose - sem splash)" {
        linux   ${KATU_KERNEL} boot=live components locale=pt_BR keyboard-layouts=br
        initrd  ${KATU_INITRD}
    }

    menuentry "Katu OS (modo RAM - copia para memoria)" {
        linux   ${KATU_KERNEL} boot=live components toram ${KATU_BOOT}
        initrd  ${KATU_INITRD}
    }

}
