# Katu OS — GRUB configuration (Live USB)

set default=0
set timeout=8
set timeout_style=menu

# Encontrar dispositivo de boot pelo squashfs
search --no-floppy --set=root --file /live/filesystem.squashfs

# Encontrar kernel e initrd (nomes podem ser versionados ex: vmlinuz-6.12.x-amd64)
set kernel="/live/vmlinuz"
set rd="/live/initrd.img"
for k in /live/vmlinuz-*; do
    set kernel="$k"
done
for i in /live/initrd.img-*; do
    set rd="$i"
done

# Tema Katu
if [ -f /boot/grub/themes/katu/theme.txt ]; then
    set theme=/boot/grub/themes/katu/theme.txt
    export theme
fi

# Carrega fonte para menu grafico
if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
fi

# Parametros de boot padrao Katu
set KATU_BOOT="quiet splash locale=pt_BR keyboard-layouts=br"

# === Entradas do menu ===

menuentry "Experimentar Katu OS" --class katu --class gnu-linux --class os {
    linux   $kernel boot=live components ${KATU_BOOT} noeject
    initrd  $rd
}

menuentry "Instalar Katu OS" --class katu --class installer {
    linux   $kernel boot=live components ${KATU_BOOT} noeject
    initrd  $rd
}

submenu "Opcoes avancadas" --class submenu {

    menuentry "Katu OS (modo de seguranca)" {
        linux   $kernel boot=live components nomodeset locale=pt_BR
        initrd  $rd
    }

    menuentry "Katu OS (verbose - sem splash)" {
        linux   $kernel boot=live components locale=pt_BR keyboard-layouts=br
        initrd  $rd
    }

    menuentry "Katu OS (modo RAM - copia para memoria)" {
        linux   $kernel boot=live components toram ${KATU_BOOT}
        initrd  $rd
    }

}
